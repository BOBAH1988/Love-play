name: Проверка проекта

# Запускается на каждый push и pull request в main.
# Отвечает на один вопрос: не сломали ли последнее изменение?
# Проверяет структуру проекта, а не игровую логику — визуальные баги
# (например, белая полоса в iOS-PWA) ловятся только на реальном устройстве.
#
# Красный статус в списке коммитов = что-то сломано, деплой трогать не нужно.
# Локально то же самое: node tools/check.js

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Возможность запустить проверку вручную из вкладки Actions.
  workflow_dispatch:

# Проверка только читает код — прав на запись в репозиторий не требуется.
permissions:
  contents: read

jobs:
  check:
    name: node tools/check.js
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false        # проверяем обе версии, даже если одна упала
      matrix:
        # LTS — то, что стоит у большинства; latest — защита от будущих
        # изменений в Node. Если проект сломается на новой версии, это
        # выяснится здесь, а не на устройстве пользователя.
        node-version: [20.x, 22.x]

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # У проекта нет package.json и зависимостей — это осознанный выбор
      # (см. README, «Технические ограничения»). Устанавливать нечего.
      - name: Проверка структуры проекта
        run: node tools/check.js

      # Тот же прогон с деталями — попадает в лог, если что-то упало.
      # Выполняется только при ошибке, чтобы не засорять успешный лог.
      - name: Подробный отчёт при ошибке
        if: failure()
        run: node tools/check.js --verbose
